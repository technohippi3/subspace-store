name: model

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python model, service and controller tests
        run: python3 -m unittest discover -s tests -t .
      - name: Every fixed-price MVP case has development evidence
        run: python3 tools/case_coverage.py --check

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the compiler pinned in package-lock.json
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check the port, tests included
        run: npm run check
      - name: TypeScript models, domain tests and baseline vector replay
        run: npm test
