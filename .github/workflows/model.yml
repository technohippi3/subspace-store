name: model

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Named cases and generated sequences (model only)
        run: python3 -m unittest discover -s tests -t .
      - name: Every fixed-price MVP case has a model test
        run: python3 tools/case_coverage.py --check
